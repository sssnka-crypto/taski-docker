# Файл main.yml
# Имя workflow
name: Main Taski Workflow
# Перечень событий-триггеров, при которых должен запускать>
on:
  # Событие push возникает,
  # когда изменения исходного кода приходят на сервер GitH>
  push:
    # Отслеживаем изменения только в ветке main
    branches:
      - main
# Перечень задач
jobs:
  # Единственная задача — склонировать код
  # и вывести в консоль дерево файлов
  checkout-and-print-tree:
    runs-on: ubuntu-latest
    steps:
      # На GitHub Actions есть готовые описания шагов,
      # их можно использовать в своих workflow.
      # Применим готовое описание шага для получения исход>
      - name: Check out repository code  # Имя шага задаём>
        uses: actions/checkout@v3  # Берём готовое решение>
      # Выполняем команду tree в текущей директории
      - name: Print project tree
        run: tree .
